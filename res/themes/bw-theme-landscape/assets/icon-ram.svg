  <rect x="21" y="23" width="2" height="3" fill="#555"/>
  <!-- Contact pads - right side -->
  <rect x="29" y="23" width="2" height="3" fill="#555"/>
  <rect x="32" y="23" width="2" height="3" fill="#555"/>
  <rect x="35" y="23" width="2" height="3" fill="#555"/>
  <rect x="38" y="23" width="2" height="3" fill="#555"/>
  <rect x="41" y="23" width="2" height="3" fill="#555"/>
  <rect x="44" y="23" width="2" height="3" fill="#555"/>
  <rect x="47" y="23" width="2" height="3" fill="#555"/>
