  <rect x="5" y="9" width="7" height="11" rx="0.5" fill="#2A2A2A" stroke="#555" stroke-width="0.4"/>
  <rect x="14" y="9" width="7" height="11" rx="0.5" fill="#2A2A2A" stroke="#555" stroke-width="0.4"/>
  <rect x="23" y="9" width="7" height="11" rx="0.5" fill="#2A2A2A" stroke="#555" stroke-width="0.4"/>
  <rect x="32" y="9" width="7" height="11" rx="0.5" fill="#2A2A2A" stroke="#555" stroke-width="0.4"/>
  <rect x="41" y="9" width="7" height="11" rx="0.5" fill="#2A2A2A" stroke="#555" stroke-width="0.4"/>
  <!-- Key notch -->
  <rect x="24" y="23" width="4" height="3" fill="#1A1A1A"/>
  <!-- Contact pads - left side -->
  <rect x="3" y="23" width="2" height="3" fill="#555"/>
  <rect x="6" y="23" width="2" height="3" fill="#555"/>
