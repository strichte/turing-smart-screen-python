# WireView Dark Green — 3.5" portrait dashboard theme
#
# Dark-mode system monitor theme inspired by bash-dark-green-gpu, extended with
# WireView 2 Pro power-monitor sensors (see WIREVIEW.md and
# library/sensors/sensors_custom.py).
#
# Plain black background (no background image). Custom sensor classes are
# referenced by their exact class name under STATS -> CUSTOM and must match
# library/sensors/sensors_custom.py.
#
# Screen: 3.5 inch, portrait (320 x 480). All X/Y coordinates are in pixels.
---
display:
  DISPLAY_ORIENTATION: portrait
  DISPLAY_RGB_LED: 30, 255, 50

# Static text elements are drawn once at startup and stay on screen.
# CLEAR paints the whole screen black first so the display boot message
# is fully overwritten (each subsequent text element only repaints its
# own bounding box, so without CLEAR the boot text would show in the gaps).
# The remaining entries are section headers for the text-only dashboard.
static_text:
  CLEAR:
    TEXT: " "
    X: 0
    Y: 0
    WIDTH: 320
    HEIGHT: 480
    FONT: roboto-mono/RobotoMono-Regular.ttf
    FONT_SIZE: 10
    FONT_COLOR: 0, 0, 0
    BACKGROUND_COLOR: 0, 0, 0
  HEADER_CPU:
    TEXT: "CPU"
    X: 4
    Y: 6
    FONT: roboto-mono/RobotoMono-Bold.ttf
    FONT_SIZE: 12
    FONT_COLOR: 53, 191, 92
    BACKGROUND_COLOR: 0, 0, 0
  HEADER_GPU:
    TEXT: "GPU"
    X: 150
    Y: 6
    FONT: roboto-mono/RobotoMono-Bold.ttf
    FONT_SIZE: 12
    FONT_COLOR: 53, 191, 92
    BACKGROUND_COLOR: 0, 0, 0
  HEADER_WIREVIEW:
    TEXT: "WireView"
    X: 4
    Y: 106
    FONT: roboto-mono/RobotoMono-Bold.ttf
    FONT_SIZE: 12
    FONT_COLOR: 53, 191, 92
    BACKGROUND_COLOR: 0, 0, 0
  HEADER_RAM:
    TEXT: "RAM"
    X: 4
    Y: 282
    FONT: roboto-mono/RobotoMono-Bold.ttf
    FONT_SIZE: 12
    FONT_COLOR: 53, 191, 92
    BACKGROUND_COLOR: 0, 0, 0
  HEADER_DISK:
    TEXT: "DISK"
    X: 150
    Y: 400
    FONT: roboto-mono/RobotoMono-Bold.ttf
    FONT_SIZE: 12
    FONT_COLOR: 53, 191, 92
    BACKGROUND_COLOR: 0, 0, 0

STATS:
