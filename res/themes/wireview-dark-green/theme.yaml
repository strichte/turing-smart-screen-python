        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: -90
        ANGLE_END: 270
        ANGLE_STEPS: 1
        ANGLE_SEP: 0
        CLOCKWISE: True
        BAR_COLOR: 53, 191, 92
        SHOW_TEXT: True
        SHOW_UNIT: False
        FONT: roboto-mono/RobotoMono-Regular.ttf
        FONT_SIZE: 16
        FONT_COLOR: 53, 191, 92
        BACKGROUND_COLOR: 0, 0, 0
    TEMPERATURE:
