<svg xmlns="http://www.w3.org/2000/svg" width="55" height="50" viewBox="0 0 55 50">
  <!-- CPU chip icon -->
  <!-- Pins - top -->
  <rect x="12" y="0" width="3" height="5" fill="#2A2A2A"/>
  <rect x="20" y="0" width="3" height="5" fill="#2A2A2A"/>
  <rect x="28" y="0" width="3" height="5" fill="#2A2A2A"/>
  <rect x="36" y="0" width="3" height="5" fill="#2A2A2A"/>
  <!-- Pins - bottom -->
  <rect x="12" y="45" width="3" height="5" fill="#2A2A2A"/>
  <rect x="20" y="45" width="3" height="5" fill="#2A2A2A"/>
  <rect x="28" y="45" width="3" height="5" fill="#2A2A2A"/>
  <rect x="36" y="45" width="3" height="5" fill="#2A2A2A"/>
  <!-- Pins - left -->
  <rect x="0" y="12" width="5" height="3" fill="#2A2A2A"/>
  <rect x="0" y="20" width="5" height="3" fill="#2A2A2A"/>
  <rect x="0" y="28" width="5" height="3" fill="#2A2A2A"/>
  <rect x="0" y="36" width="5" height="3" fill="#2A2A2A"/>
  <!-- Pins - right -->
  <rect x="50" y="12" width="5" height="3" fill="#2A2A2A"/>
  <rect x="50" y="20" width="5" height="3" fill="#2A2A2A"/>
  <rect x="50" y="28" width="5" height="3" fill="#2A2A2A"/>
  <rect x="50" y="36" width="5" height="3" fill="#2A2A2A"/>
  <!-- Chip body -->
  <rect x="5" y="5" width="45" height="40" rx="2" fill="#3A3A3A"/>
  <!-- Inner die area -->
  <rect x="9" y="9" width="37" height="32" rx="1" fill="#2A2A2A" stroke="#555" stroke-width="0.5"/>
  <!-- CPU text -->
  <text x="27.5" y="30" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">CPU</text>
</svg>