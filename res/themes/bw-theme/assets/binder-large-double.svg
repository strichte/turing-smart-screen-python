<svg xmlns="http://www.w3.org/2000/svg" width="320" height="209" viewBox="0 0 320 209">
  <!-- Large binder double height: full-width, 6 content rows -->
  <!-- Black background/border (5px on all sides) -->
  <rect x="0" y="0" width="320" height="209" fill="#000000"/>
  <!-- Grey title bar (y=5 to y=24, height=19px) with chamfered right edge -->
  <polygon points="5,5 304,5 313,24 5,24" fill="#C0C0C0"/>
  <!-- Bullet square -->
  <rect x="10" y="11" width="7" height="7" fill="#000000"/>
  <!-- Separator (2px black - y=24-25) -->
  <!-- White content area (y=26 to y=204, height=178px) -->
  <rect x="5" y="26" width="310" height="178" fill="#FFFFFF"/>
</svg>