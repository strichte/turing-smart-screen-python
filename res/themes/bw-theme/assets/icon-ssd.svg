<svg xmlns="http://www.w3.org/2000/svg" width="32" height="38" viewBox="0 0 32 38">
  <!-- SSD drive icon -->
  <!-- Body -->
  <rect x="2" y="2" width="28" height="34" rx="2" fill="#3A3A3A"/>
  <!-- Inner panel -->
  <rect x="4" y="4" width="24" height="30" rx="1" fill="#2A2A2A" stroke="#555" stroke-width="0.5"/>
  <!-- SSD text -->
  <text x="16" y="16" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle">SSD</text>
  <!-- Flash chip lines -->
  <rect x="7" y="20" width="18" height="2" rx="0.5" fill="#555"/>
  <rect x="7" y="24" width="18" height="2" rx="0.5" fill="#555"/>
  <rect x="7" y="28" width="18" height="2" rx="0.5" fill="#555"/>
  <!-- Connector at top -->
  <rect x="10" y="0" width="4" height="3" fill="#555"/>
  <rect x="18" y="0" width="4" height="3" fill="#555"/>
</svg>